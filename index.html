<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kuyubaşı Hızlı Loglama</title><link rel="manifest" href="manifest.json" crossorigin="use-credentials"><meta name="theme-color" content="#1F4E78"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f4f5f7;--fg:#1b1f24;--card:#fff;--ac:#1F4E78;--mut:#6b7280;--bd:#d5d9df;--ok:#1a7f37;--er:#b42318}
@media(prefers-color-scheme:dark){:root{--bg:#14171a;--fg:#e8eaed;--card:#1f2428;--ac:#5aa0e0;--mut:#9aa3ad;--bd:#343b42}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px system-ui,sans-serif;padding-bottom:84px}
header{background:var(--ac);color:#fff;padding:10px 14px;position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center}
header b{font-size:17px}header small{opacity:.9}
.tabs{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;padding:14px 4px;border:0;background:none;color:var(--mut);font-size:14px;font-weight:600}.tabs .on{color:var(--ac);border-top:3px solid var(--ac)}
main{padding:12px;max-width:720px;margin:auto}.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}input,select,textarea{width:100%;padding:12px;font-size:17px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--fg)}
.row{display:flex;gap:8px}.row>*{flex:1}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{padding:9px 12px;border:1px solid var(--bd);border-radius:20px;background:var(--bg);color:var(--fg);font-size:15px}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}.btn{padding:14px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-size:17px;font-weight:700;width:100%;margin-top:10px}
.btn.s{background:var(--bg);color:var(--fg);border:1px solid var(--bd)}.big{font-size:22px;font-weight:700}.pre{background:var(--bg);border-radius:8px;padding:8px;font-size:14px;color:var(--mut);min-height:40px}
.it{display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--bd);padding:8px 0;font-size:14px}.it i{width:14px;height:34px;border:1px solid #0006;flex:none}.it div{flex:1}.it button{border:0;background:none;color:var(--er);font-size:20px}
.w{color:var(--er)}.o{color:var(--ok)}.strip{display:flex;flex-direction:column;width:70px;height:340px;border:1px solid var(--fg)}
.chip{padding:12px 16px;min-height:46px}.btn{min-height:52px}input,select,textarea{min-height:48px}.chips.q .chip{font-weight:700}
header .lg{display:flex;align-items:center;gap:10px;min-width:0}header .lg b{white-space:nowrap}header .rt{display:flex;align-items:center;gap:10px}
header button{background:#ffffff26;border:1px solid #ffffff66;color:#fff;border-radius:8px;min-width:44px;min-height:40px;font-size:20px}
html[data-c="1"]{--bg:#fff;--fg:#000;--card:#fff;--ac:#0b2a4a;--mut:#222;--bd:#000;--ok:#006400;--er:#a00000}html[data-c="1"] .chip{border-width:2px}html[data-c="1"] .card{border-width:2px}
.it img{width:84px;height:64px;object-fit:cover;border-radius:6px;flex:none}label.btn{display:block;text-align:center;margin-top:10px;color:#fff;font-size:17px}label.btn.s{color:var(--fg)}
#ek,#ke{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom));z-index:4;box-shadow:0 0 0 6px var(--card)}
</style></head><body>
